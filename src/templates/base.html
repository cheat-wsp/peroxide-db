<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Peroxide DB{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="{{ asset }}favicon.svg">
<link rel="stylesheet" href="{{ asset }}style.css">
</head>
<body>
<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Abrir menu">☰</button>
  <a class="brand" href="{{ home }}">Peroxide DB</a>
  <span class="count">{{ total }} páginas</span>
  <div class="lang-toggle" role="group" aria-label="Idioma">
    <button id="langPt" type="button">PT-BR</button>
    <button id="langEn" type="button">EN</button>
  </div>
  <a class="search-link" href="{{ search_page }}">Buscar</a>
</header>
<div id="google_translate_element" style="display:none"></div>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <input type="search" id="sideSearch" placeholder="Buscar... (Enter vai p/ busca)" autocomplete="off">
    <nav>
      <p class="nav-title">Categorias</p>
      <ul>
        {% for cat in categories %}
        <li><a href="{{ cat_url[cat] }}">{{ cat }} <span class="badge">{{ cat_counts[cat] }}</span></a></li>
        {% endfor %}
      </ul>
    </nav>
  </aside>
  <main class="content">
    {% block content %}{% endblock %}
    <footer><p>Conteúdo textual do wiki Peroxide Roblox (Fandom), reorganizado. Sem afiliação oficial.</p></footer>
  </main>
</div>
<script src="{{ asset }}app.js"></script>
<script>
// Toggle PT-BR/EN via Google Translate (gratuito, sem chave).
// Padrão: PT-BR (traduz automaticamente na primeira visita).
function googTransCookie(val) {
  document.cookie = 'googtrans=' + val + ';path=/';
  document.cookie = 'googtrans=' + val + ';path=/;domain=' + location.hostname;
}
function tradutorParaPT() { googTransCookie('/en/pt'); location.reload(); }
function tradutorParaEN() { googTransCookie('/en/en'); location.reload(); }
function googleTranslateElementInit() {
  new google.translate.TranslateElement(
    {pageLanguage: 'en', includedLanguages: 'en,pt', autoDisplay: false},
    'google_translate_element');
}
(function () {
  var m = document.cookie.match(/(?:^|;)\s*googtrans=([^;]*)/);
  var pt = !m || m[1].indexOf('/pt') !== -1;
  var bPt = document.getElementById('langPt'), bEn = document.getElementById('langEn');
  if (bPt && bEn) {
    bPt.classList.toggle('active', pt);
    bEn.classList.toggle('active', !pt);
    bPt.addEventListener('click', tradutorParaPT);
    bEn.addEventListener('click', tradutorParaEN);
  }
  if (!m) { googTransCookie('/en/pt'); location.reload(); }  // primeira visita: PT-BR
})();
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
{% block scripts %}{% endblock %}
</body>
</html>
