name: Atualizar Peroxide DB (semanal)

on:
  schedule:
    - cron: "0 3 * * 0"  # domingo 03:00 UTC
  workflow_dispatch: {}  # permite rodar manualmente

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Scraping (via MediaWiki API)
        run: python scripts/scrape.py
      - name: Build do site
        run: python scripts/build.py
      - name: Commit automático
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pages.json data/failed.json docs/
          git diff --cached --quiet && echo "Nada mudou" || git commit -m "Auto-update: scraping semanal $(date -u +%Y-%m-%d)"
          git push
      - name: Garantir Pages ativo
        run: |
          gh api repos/${{ github.repository }}/pages -X PUT \
            -f source[branch]=main -f source[path]=/docs || \
          gh api repos/${{ github.repository }}/pages -X POST \
            -f source[branch]=main -f source[path]=/docs || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
